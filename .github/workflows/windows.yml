# Gera o Assistente-Juridico PRONTO para Windows: um .zip com tudo dentro (inclusive o
# Node), que abre com dois cliques sem instalar nada.
# Diferente da receita da Replit: é montado NO WINDOWS, o app montado é
# TESTADO antes, e se algo falhar a execução fica VERMELHA (nada de "verde
# enganando"). No fim, o arquivo fica em "Releases" para baixar.
name: Gerar app para Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar as peças
        run: npm install --no-audit --no-fund

      - name: Montar a tela
        run: npm run build

      - name: Tirar o que só servia para montar
        run: npm prune --omit=dev

      - name: Montar a pasta do app
        shell: pwsh
        run: |
          $out = "Assistente-Juridico"
          New-Item -ItemType Directory $out | Out-Null
          foreach ($i in "dist","server","shared","client","node_modules","scripts","package.json","tsconfig.json","vite.config.ts","LEIA-ME.md",".env.exemplo") {
            Copy-Item $i -Destination $out -Recurse
          }
          New-Item -ItemType Directory "$out/node" | Out-Null
          Copy-Item (Get-Command node).Source "$out/node/node.exe"
          Copy-Item "windows/Abrir-Juridico.bat" $out

      - name: Testar o app montado (do jeito que vai rodar no seu PC)
        shell: pwsh
        run: |
          cd Assistente-Juridico
          $env:NO_BROWSER = "1"
          $p = Start-Process -FilePath "node\node.exe" -ArgumentList "scripts\abrir-pronto.mjs" -PassThru -NoNewWindow -RedirectStandardOutput ..\app.log -RedirectStandardError ..\app.err
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { if ((Invoke-WebRequest http://localhost:5000/api/auth/check -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep 1
          }
          if (-not $ok) { Get-Content ..\app.log, ..\app.err; throw "O servidor não ligou" }
          $html = (Invoke-WebRequest http://localhost:5000/ -UseBasicParsing).Content
          if ($html -notmatch 'id="root"') { throw "A tela não abriu" }
          Invoke-RestMethod -Method Post -ContentType "application/json; charset=utf-8" -Body '{"titulo":"Teste","categoria":"Geral","texto":"Acao de cobranca"}' http://localhost:5000/api/ementas | Out-Null
          $e = Invoke-RestMethod http://localhost:5000/api/ementas
          if (-not ($e | Where-Object { $_.texto -eq "Acao de cobranca" })) { throw "Não salvou no banco" }
          taskkill /pid $p.Id /T /F | Out-Null
          Start-Sleep 2
          Remove-Item -Recurse -Force dados -ErrorAction SilentlyContinue
          Write-Host "APP TESTADO ✅"

      - name: Compactar
        shell: pwsh
        run: 7z a -tzip -mx=5 Assistente-Juridico-Windows.zip Assistente-Juridico | Out-Null

      - name: Guardar o arquivo (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-Juridico-Windows
          path: Assistente-Juridico-Windows.zip
          if-no-files-found: error

      - name: Publicar para baixar (Releases)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "windows-${{ github.run_number }}" Assistente-Juridico-Windows.zip \
            --title "Assistente-Juridico para Windows nº ${{ github.run_number }}" \
            --notes "Baixe o Assistente-Juridico-Windows.zip, clique com o botão direito > Extrair tudo, e dê dois cliques em Abrir-Juridico.bat. Não precisa instalar nada."

      - name: Mostrar o registro do app (se algo falhou)
        if: failure()
        shell: pwsh
        run: Get-Content app.log, app.err -ErrorAction SilentlyContinue
