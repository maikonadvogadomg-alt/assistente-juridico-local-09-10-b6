<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente Jurídico Pro</title>

<!-- CDN: PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- CDN: Mammoth (DOCX) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<!-- CDN: Tesseract (OCR) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<!-- CDN: Docx (criar Word) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/7.8.2/docx.min.js"></script>
<!-- CDN: FileSaver -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<!-- CDN: Marked (Markdown) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #141c0d;
  --bg2:      #1c2714;
  --bg3:      #252f1a;
  --border:   #2a3a1a;
  --amber:    #d97706;
  --amber2:   #fbbf24;
  --text:     #e5e7eb;
  --muted:    #6b7280;
  --green:    #4ade80;
  --red:      #f87171;
  --purple:   #a78bfa;
  --blue:     #60a5fa;
  --cyan:     #22d3ee;
  --orange:   #fb923c;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; overflow: hidden; }

/* ── LAYOUT ── */
.app { display: flex; flex-direction: column; height: 100dvh; }

/* ── HEADER ── */
.header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.header-title { font-size: 13px; font-weight: 700; color: var(--amber2); display: flex; align-items: center; gap: 6px; flex: 1; }
.badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; border: 1px solid; white-space: nowrap; }
.badge-demo  { background: #78350f33; color: #fbbf24; border-color: #92400e55; }
.badge-ok    { background: #14532d33; color: #4ade80; border-color: #16653355; }
.badge-pro   { background: #4c1d9533; color: var(--purple); border-color: #8b5cf633; }
.btn-icon { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; }
.btn-icon:hover { background: #ffffff10; color: var(--text); }
.btn-icon.ativo { background: #ffffff15; color: var(--text); }

/* ── PAINEL CONFIG ── */
.config-panel {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 12px 14px;
  display: none; flex-direction: column; gap: 10px;
  flex-shrink: 0; max-height: 60vh; overflow-y: auto;
}
.config-panel.aberto { display: flex; }
.config-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.config-row { display: flex; gap: 6px; align-items: center; }
.inp {
  flex: 1; height: 32px; padding: 0 10px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 11px; outline: none;
  font-family: monospace;
}
.inp:focus { border-color: var(--amber); }
.inp-sm { width: 130px; flex: none; }
.provider-tag { font-size: 10px; color: var(--amber2); white-space: nowrap; }

/* ── ABAS ── */
.tabs {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex; flex-shrink: 0; overflow-x: auto;
}
.tab-btn {
  flex: 1; padding: 9px 4px; font-size: 11px; font-weight: 600;
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--muted); cursor: pointer; transition: all .15s;
  white-space: nowrap; min-width: 80px;
}
.tab-btn.ativo { border-bottom-color: var(--amber); color: var(--amber2); }

/* ── BARRA ESFORÇO ── */
.effort-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; background: #1a2411;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.effort-label { font-size: 10px; font-weight: 700; white-space: nowrap; }
.effort-bar input[type=range] { flex: 1; accent-color: var(--amber); height: 3px; }
.verbosity-btn {
  font-size: 10px; padding: 3px 10px; border-radius: 20px;
  border: 1px solid; cursor: pointer; background: none; white-space: nowrap;
}

/* ── CONTEÚDO ── */
.content { flex: 1; overflow-y: auto; }
.tab-pane { display: none; padding: 12px 14px; }
.tab-pane.ativo { display: block; }

/* ── TEXTAREA ── */
textarea {
  width: 100%; resize: none;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 12px;
  padding: 10px 12px; outline: none; line-height: 1.6; font-family: Arial;
}
textarea:focus { border-color: var(--amber); }

/* ── BOTÕES ── */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 14px; border-radius: 8px; border: 1px solid;
  font-size: 11px; font-weight: 600; cursor: pointer; transition: all .15s;
  white-space: nowrap; background: none;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-amber  { background: #92400e33; border-color: #d9770655; color: var(--amber2); }
.btn-amber:hover:not(:disabled)  { background: #92400e55; }
.btn-ghost  { background: none; border-color: var(--border); color: var(--muted); }
.btn-ghost:hover:not(:disabled)  { color: var(--text); border-color: #4b5563; }
.btn-red    { background: #7f1d1d33; border-color: #ef444433; color: var(--red); }
.btn-red:hover:not(:disabled)    { background: #7f1d1d55; }
.btn-green  { background: #14532d33; border-color: #22c55e33; color: var(--green); }
.btn-green:hover:not(:disabled)  { background: #14532d55; }
.btn-purple { background: #4c1d9533; border-color: #8b5cf633; color: var(--purple); }
.btn-purple:hover:not(:disabled) { background: #4c1d9555; }
.btn-blue   { background: #1e3a5f33; border-color: #3b82f633; color: var(--blue); }
.btn-blue:hover:not(:disabled)   { background: #1e3a5f55; }
.btn-cyan   { background: #164e6333; border-color: #22d3ee33; color: var(--cyan); }
.btn-cyan:hover:not(:disabled)   { background: #164e6355; }
.btn-full { width: 100%; justify-content: center; }

/* ── GRID AÇÕES ── */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; }
.action-btn {
  padding: 10px 6px; border-radius: 10px; border: 1px solid;
  font-size: 11px; font-weight: 600; cursor: pointer; transition: all .15s;
  text-align: center; background: var(--bg2);
}
.action-btn:hover:not(:disabled) { filter: brightness(1.2); }
.action-btn:disabled { opacity: .4; cursor: not-allowed; }
.action-btn.ativo { filter: brightness(1.3); }

/* ── RESULTADO ── */
.resultado-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px;
  font-family: 'Times New Roman', Georgia, serif;
  font-size: 13px; line-height: 1.9; color: var(--text);
  min-height: 80px; white-space: pre-wrap;
  overflow-x: auto;
}
.resultado-box p { margin: 0; text-align: justify; }
.resultado-box .titulo-peca { font-weight: bold; text-indent: 0 !important; }
.resultado-box .item-lista  { padding-left: 1cm; text-indent: 0 !important; }
.resultado-box .citacao     { padding-left: 4cm; font-size: 12px; text-indent: 0 !important; }
.resultado-box .paragrafo   { text-indent: 4cm; }

/* ── EDITOR FORMATAÇÃO ── */
.editor-toolbar {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px; margin-bottom: 10px;
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.editor-toolbar select, .editor-toolbar input[type=number] {
  height: 28px; padding: 0 8px; background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-size: 11px; outline: none;
}
.editor-toolbar select:focus, .editor-toolbar input:focus { border-color: var(--amber); }
.editor-toolbar .sep { width: 1px; height: 24px; background: var(--border); }
.format-btn {
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg); color: var(--muted); font-size: 11px;
  cursor: pointer; transition: all .15s; font-weight: 600;
}
.format-btn:hover { background: #ffffff10; color: var(--text); }
.format-btn.ativo { background: var(--amber); color: #000; border-color: var(--amber); }

/* ── CHAT ── */
.chat-msgs { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; padding: 4px 0; }
.msg-user { background: #78350f33; border: 1px solid #92400e44; border-radius: 10px; padding: 8px 12px; font-size: 12px; margin-left: 20px; }
.msg-ia   { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 12px; margin-right: 20px; }
.msg-role { font-size: 10px; font-weight: 700; opacity: .5; margin-bottom: 3px; }

/* ── CARDS ── */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
.card-title { font-size: 12px; font-weight: 700; color: var(--amber2); margin-bottom: 4px; }
.card-sub   { font-size: 11px; color: var(--muted); }
.card-selected { border-color: #22c55e55; background: #14532d22; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: #00000088; backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.modal-overlay.aberto { display: flex; }
.modal {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; max-width: 600px; width: 100%;
  max-height: 80vh; overflow-y: auto; padding: 20px;
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 14px; font-weight: 700; color: var(--amber2); }
.modal-close {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 20px; padding: 0; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
}
.modal-close:hover { background: #ffffff10; color: var(--text); }

/* ── MISC ── */
.section-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; margin-top: 14px; }
.section-title:first-child { margin-top: 0; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.spacer { height: 10px; }
.divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.spinner { width: 14px; height: 14px; border: 2px solid #ffffff22; border-top-color: var(--amber); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none !important; }
.text-green  { color: var(--green); }
.text-red    { color: var(--red); }
.text-amber  { color: var(--amber2); }
.text-muted  { color: var(--muted); }
.text-purple { color: var(--purple); }
.text-blue   { color: var(--blue); }
.text-cyan   { color: var(--cyan); }
.fs10 { font-size: 10px; }
.fs11 { font-size: 11px; }
.fs12 { font-size: 12px; }

/* ── EMENTA CHECK ── */
.ementa-check { width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-top: 2px; }
.ementa-check.marcado { background: #22c55e; border-color: #22c55e; }

/* ── STOP BAR ── */
.stop-bar { padding: 8px 14px; flex-shrink: 0; }

/* ── TTS CONTROLS ── */
.tts-controls {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px; margin-top: 10px;
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.tts-controls select { height: 28px; padding: 0 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 11px; }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
</style>
</head>
<body>
<div class="app">

<!-- ══ HEADER ══ -->
<header class="header">
  <div class="header-title">⚖️ Assistente Jurídico Pro</div>
  <span class="badge badge-pro">v2.0</span>
  <span class="badge badge-demo" id="badge-status">Demo</span>
  <button class="btn-icon" id="btn-config" onclick="toggleConfig()" title="Configurações">⚙️</button>
</header>

<!-- ══ CONFIG PANEL ══ -->
<div class="config-panel" id="config-panel">

  <div>
    <div class="config-label">Chave de Resumo / Limpeza (Gemini Flash — gratuito)</div>
    <div class="config-row">
      <input class="inp" type="password" id="key-resumo" placeholder="AIza... (Gemini)" oninput="salvarChaves()">
      <span class="provider-tag" id="tag-resumo"></span>
    </div>
    <div class="fs10 text-muted" style="margin-top:4px">Usada para extrair e limpar o texto antes de gerar a peça. Gemini Flash tem tier gratuito.</div>
  </div>
